# Build, test and deploy the static export to Cloudflare Pages on every push to main.
# Needs repository secrets CLOUDFLARE_API_TOKEN_PORTFOLIO (Pages: Edit) and CLOUDFLARE_ACCOUNT_ID — see README › Triển khai › CI/CD.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Refreshes src/data/github-contributions.json so the deployed heatmap is current.
      # Never fails the job: the script exits 0 and keeps the committed snapshot on any error.
      - name: Refresh GitHub contributions
        run: node tools/fetch-github-contributions.ts
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PORTFOLIO }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
